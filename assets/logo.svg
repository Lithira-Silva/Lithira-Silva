<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="Lithira Silva">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="100%" stop-color="#161B22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#E6B17E"/>
      <stop offset="100%" stop-color="#C98B8B"/>
      <animate attributeName="x1" values="0;1;0" dur="8s" repeatCount="indefinite"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#E6B17E" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#E6B17E" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .draw { stroke-dasharray: 520; stroke-dashoffset: 520; animation: draw 2.4s ease forwards, breathe 4s ease-in-out 2.4s infinite; }
      .fill { opacity: 0; animation: fade 1s ease 1.8s forwards; }
      .name { opacity: 0; animation: rise 1s ease 1.2s forwards; }
      .sub  { opacity: 0; animation: rise 1s ease 1.7s forwards; }
      .line { stroke-dasharray: 340; stroke-dashoffset: 340; animation: draw 1.4s ease 2s forwards; }
      .orbit { transform-origin: 160px 130px; animation: spin 9s linear infinite; }
      .halo { transform-origin: 160px 130px; animation: pulse 4s ease-in-out infinite; }
      .star { animation: twinkle 3s ease-in-out infinite; }
      .s2 { animation-delay: .8s; } .s3 { animation-delay: 1.6s; } .s4 { animation-delay: 2.2s; } .s5 { animation-delay: 1.1s; }
      @keyframes draw { to { stroke-dashoffset: 0; } }
      @keyframes fade { to { opacity: 1; } }
      @keyframes rise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes pulse { 0%,100% { transform: scale(1); opacity: .7; } 50% { transform: scale(1.12); opacity: 1; } }
      @keyframes breathe { 0%,100% { stroke-opacity: 1; } 50% { stroke-opacity: .55; } }
      @keyframes twinkle { 0%,100% { opacity: .15; } 50% { opacity: .9; } }
      text { font-family: 'Segoe UI', -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <rect width="900" height="260" rx="22" fill="url(#bg)"/>
  <rect x="1" y="1" width="898" height="258" rx="21" fill="none" stroke="#30363D"/>

  <circle class="star" cx="560" cy="46" r="1.6" fill="#E6EDF3"/>
  <circle class="star s2" cx="820" cy="70" r="1.4" fill="#E6EDF3"/>
  <circle class="star s3" cx="760" cy="210" r="1.8" fill="#E6B17E"/>
  <circle class="star s4" cx="420" cy="220" r="1.3" fill="#E6EDF3"/>
  <circle class="star s5" cx="860" cy="160" r="1.5" fill="#C98B8B"/>

  <circle class="halo" cx="160" cy="130" r="92" fill="url(#glow)"/>

  <polygon class="draw" points="160,52 228,91 228,169 160,208 92,169 92,91"
           fill="none" stroke="url(#accent)" stroke-width="3" stroke-linejoin="round" filter="url(#soft)"/>
  <polygon class="fill" points="160,62 219,96 219,164 160,198 101,164 101,96" fill="#161B22"/>

  <text class="fill" x="160" y="150" text-anchor="middle" font-size="58" font-weight="700"
        fill="url(#accent)" letter-spacing="2">LS</text>

  <g class="orbit">
    <circle cx="160" cy="26" r="5" fill="#E6B17E" filter="url(#soft)"/>
    <circle cx="160" cy="234" r="3" fill="#C98B8B" opacity=".8"/>
  </g>
  <circle cx="160" cy="130" r="104" fill="none" stroke="#30363D" stroke-dasharray="2 8"/>

  <text class="name" x="300" y="120" font-size="54" font-weight="700" fill="#E6EDF3" letter-spacing="1">Lithira Silva</text>
  <line class="line" x1="302" y1="142" x2="640" y2="142" stroke="#E6B17E" stroke-width="2" stroke-linecap="round"/>
  <text class="sub" x="302" y="176" font-size="20" fill="#8B949E" letter-spacing="3">UI/UX DESIGNER  ·  FRONT-END DEVELOPER</text>
</svg>
